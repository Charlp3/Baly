<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivi de mon chien – v2.0</title>

<style>
body{font-family:Arial,sans-serif;margin:0;background:#D0E4F7;color:#1C2A40}
header{background:#2C5E99;color:#fff;text-align:center;padding:14px}

nav{display:flex;background:#1C3B68}
nav button{
  flex:1;
  padding:8px 4px;
  background:#1C3B68;
  color:#fff;
  border:none;
  font-size:0.85rem;
}
nav button.active{
  background:#D0E4F7;
  color:#1C3B68;
  font-weight:bold;
}

section{display:none;padding:20px}
section.active{display:block}

label{display:block;margin-top:10px;font-weight:bold}
input,textarea{
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:4px;
  border:1px solid #587EA3;
  background:#F0F8FF;
  font-size:1rem;
}

button.action{
  margin-top:12px;
  padding:10px 15px;
  background:#2C5E99;
  color:#fff;
  border:none;
  border-radius:5px;
}

button.suppr{
  background:#C0392B;
  color:#fff;
  border:none;
  border-radius:4px;
  padding:4px 8px;
  font-size:0.8rem;
  margin-top:6px;
}

hr{margin:18px 0}
</style>
</head>

<body>

<header>
Suivi de mon chien 🐶<br>
<small>© Pierre Charlier 2025 — Version 2.1</small>
</header>

<nav>
<button class="active" onclick="showTab('fiche',this)">Fiche</button>
<button onclick="showTab('sante',this)">Santé</button>
<button onclick="showTab('liens',this)">Liens</button>
</nav>

<main>

<!-- FICHE -->
<section id="fiche" class="active">
<label>Puce</label><input id="puce">
<label>Passeport</label><input id="passeport">

<label>Date de naissance</label>
<input type="date" id="naissance" onchange="updateAge();saveData(false)">
<div><strong>Âge :</strong> <span id="age">-</span></div>

<label>Poids (kg)</label><input id="poids">
<label>Vétérinaire</label><input id="veto">
<label>Téléphone</label><input id="tel">
<label>Clinique</label><input id="clinique">

<label>Nourriture</label><textarea id="nourriture"></textarea>
<label>Accessoires</label><textarea id="accessoires"></textarea>
<label>Autres</label><textarea id="autres"></textarea>

<button class="action" onclick="saveData(true)">💾 Sauvegarder</button>
<button class="action" onclick="exportData()">📤 Exporter JSON</button>
<input type="file" id="importInput" hidden accept="application/json" onchange="importData(event)">
<button class="action" onclick="importInput.click()">📥 Importer JSON</button>
</section>

<!-- SANTÉ -->
<section id="sante">

<h3>Maladies</h3>
<div id="listeMaladies"></div>
<button class="action" onclick="add('maladies')">+ Ajouter</button>
<hr>

<h3>Accidents</h3>
<div id="listeAccidents"></div>
<button class="action" onclick="add('accidents')">+ Ajouter</button>
<hr>

<h3>Traitements</h3>
<div id="listeTraitements"></div>
<button class="action" onclick="add('traitements')">+ Ajouter</button>
<hr>

<h3>Vaccinations</h3>
<div id="listeVaccins"></div>
<button class="action" onclick="add('vaccins')">+ Ajouter</button>
<hr>

<h3>Déparasitages</h3>
<div id="listeParasites"></div>
<button class="action" onclick="add('parasites')">+ Ajouter</button>

</section>

<!-- LIENS -->
<section id="liens">
<input id="nomLien" placeholder="Nom">
<input id="urlLien" placeholder="URL">
<button class="action" onclick="addLien()">+ Ajouter</button>
<hr>
<div id="listeLiens"></div>
</section>

</main>

<script>
const data={
 fiche:{},
 maladies:[],accidents:[],traitements:[],
 vaccins:[],parasites:[],
 liens:[]
};

function showTab(id,btn){
 document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 btn.classList.add("active");
}

function updateAge(){
 if(!naissance.value){age.textContent="-";return;}
 const b=new Date(naissance.value),n=new Date();
 let a=n.getFullYear()-b.getFullYear();
 if(n<b)setTimeout;
 if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;
 age.textContent=a+" an"+(a>1?"s":"");
}

function saveData(alertOn=true){
 data.fiche={puce:puce.value,passeport:passeport.value,naissance:naissance.value,
 poids:poids.value,veto:veto.value,tel:tel.value,clinique:clinique.value,
 nourriture:nourriture.value,accessoires:accessoires.value,autres:autres.value};
 localStorage.setItem("chienData",JSON.stringify(data));
 if(alertOn)alert("✔ Données sauvegardées");
}

function exportData(){
 const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="chien_v2.json";a.click();
}

function importData(e){
 const r=new FileReader();
 r.onload=()=>{Object.assign(data,JSON.parse(r.result));localStorage.setItem("chienData",JSON.stringify(data));location.reload();}
 r.readAsText(e.target.files[0]);
}

function add(type){
 data[type].push({nom:"",date:"",note:""});
 render(type); saveData(false);
}

function del(type,i){
 if(!confirm("Supprimer cet élément ?"))return;
 data[type].splice(i,1); render(type); saveData(false);
}

function render(type){
 const map={
  maladies:"listeMaladies",accidents:"listeAccidents",traitements:"listeTraitements",
  vaccins:"listeVaccins",parasites:"listeParasites"
 };
 const c=document.getElementById(map[type]);
 c.innerHTML="";

 data[type].forEach((e,i)=>{
  c.innerHTML+=`
  <input placeholder="Nom" value="${e.nom}"
    oninput="data['${type}'][${i}].nom=this.value;saveData(false)">
  <input type="date" value="${e.date}"
    onchange="data['${type}'][${i}].date=this.value;saveData(false)">
  <textarea placeholder="Remarque"
    oninput="data['${type}'][${i}].note=this.value;saveData(false)">${e.note}</textarea>
  <button class="suppr" onclick="del('${type}',${i})">Supprimer</button>
  <hr>`;
 });
}

function addLien(){
 if(!urlLien.value)return;
 data.liens.push({nom:nomLien.value||urlLien.value,url:urlLien.value});
 nomLien.value="";urlLien.value="";renderLiens();saveData(false);
}
function delLien(i){
 if(!confirm("Supprimer ce lien ?"))return;
 data.liens.splice(i,1);renderLiens();saveData(false);
}
function renderLiens(){
 listeLiens.innerHTML="";
 data.liens.forEach((l,i)=>{
  listeLiens.innerHTML+=`
  <div><strong>${l.nom}</strong><br>
  <a href="${l.url}" target="_blank">${l.url}</a><br>
  <button class="suppr" onclick="delLien(${i})">Supprimer</button><hr></div>`;
 });
}

window.onload=()=>{
 const s=JSON.parse(localStorage.getItem("chienData")||"{}");
 Object.assign(data,s);
 Object.entries(data.fiche||{}).forEach(([k,v])=>{if(window[k])window[k].value=v});
 updateAge();
 ["maladies","accidents","traitements","vaccins","parasites"].forEach(render);
 renderLiens();
};
</script>

</body>
</html>
